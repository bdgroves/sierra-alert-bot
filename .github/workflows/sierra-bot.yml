name: Sierra Nevada Alert Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-alerts:
    name: Fetch & Post Sierra Nevada Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.41.4
          cache: true

      - name: Run Sierra Nevada Alert Bot
        env:
          TWITTER_API_KEY:       ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:    ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:  ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          LOOKBACK_MINUTES:      "120"
          CACHE_FILE:            "posted_ids.json"
        run: pixi run bot

      - name: Save alert cache to repo
        run: |
          git config user.name  "Sierra Nevada Alert Bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted_ids.json || true
          git diff --cached --quiet || git commit -m "chore: update alert cache [skip ci]"
          git push || echo "Nothing to push"
