name: Tests

on:
  push:
    paths: ["bot/**", "tests/**", ".github/workflows/test.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pytest requests
      - run: pytest -q tests
